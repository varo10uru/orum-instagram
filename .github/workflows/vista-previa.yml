name: Vista previa

# En cada PR que cambie algún post.json de semanas/: revisa los post.json, genera las imágenes
# (y los Reels), las sube al mismo PR y deja un comentario con cómo va a
# salir todo. Si el PR se edita (por ejemplo, corregís un texto desde el
# celular), se vuelve a generar.
# El commit de imágenes que hace esta Action lleva [skip ci] en el mensaje,
# así no la vuelve a disparar ni deja corridas esperando aprobación.
on:
  pull_request:
    paths: ['semanas/**/post.json']

# Si llegan dos cambios seguidos, vale el último
concurrency:
  group: vista-previa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  vista-previa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Se revisan las semanas enteras (para ver fechas y temas repetidos),
      # pero se generan solo los días cuyo post.json cambió: lo ya aprobado
      # no se vuelve a generar (los Reels filman el sitio en vivo y
      # cambiarían).
      - name: Semanas y días que cambiaron
        id: semanas
        run: |
          cambios=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- semanas/ | grep '/post\.json$' || true)
          semanas=$(echo "$cambios" | cut -d/ -f1-2 | sort -u | while read -r s; do [ -n "$s" ] && [ -d "$s" ] && echo "$s"; done | tr '\n' ' ')
          dias=$(echo "$cambios" | sed 's|/post\.json$||' | sort -u | while read -r d; do [ -n "$d" ] && [ -d "$d" ] && echo "$d"; done | tr '\n' ' ')
          echo "lista=$semanas" >> "$GITHUB_OUTPUT"
          echo "dias=$dias" >> "$GITHUB_OUTPUT"
          echo "Semanas: ${semanas:-ninguna}"
          echo "Días para generar: ${dias:-ninguno}"

      # Para los Reels y para el kit de TikTok
      - name: ffmpeg
        if: steps.semanas.outputs.lista != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Revisar y generar
        id: generar
        if: steps.semanas.outputs.lista != ''
        run: |
          # Se guarda lo que dice cada paso para ponerlo en el comentario
          set +e
          node scripts/validar.mjs ${{ steps.semanas.outputs.lista }} > revision.txt 2>&1
          revision=$?
          render=0
          if [ -n "${{ steps.semanas.outputs.dias }}" ]; then
            node scripts/renderizar.mjs ${{ steps.semanas.outputs.dias }} >> revision.txt 2>&1
            render=$?
          fi
          cat revision.txt
          if [ $revision -ne 0 ] || [ $render -ne 0 ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      # El kit de TikTok (videos verticales + textos) no va al repo: queda
      # para bajar desde el comentario durante 3 semanas
      - name: Kit de TikTok
        if: steps.semanas.outputs.lista != ''
        continue-on-error: true
        run: node scripts/tiktok.mjs --salida kit-tiktok ${{ steps.semanas.outputs.lista }}

      - name: Guardar el kit de TikTok
        id: kit
        if: steps.semanas.outputs.lista != '' && hashFiles('kit-tiktok/LEEME.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: kit-tiktok
          path: kit-tiktok/
          retention-days: 21

      - name: Subir las imágenes al PR
        if: steps.semanas.outputs.lista != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A semanas/
          if ! git diff --cached --quiet; then
            git commit -m "Vista previa: imágenes generadas [skip ci]"
            git push
          fi

      - name: Comentario con la vista previa
        if: steps.semanas.outputs.lista != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OK: ${{ steps.generar.outputs.ok }}
          KIT: ${{ steps.kit.outputs.artifact-url }}
        run: |
          base="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/"
          node scripts/vista-previa.mjs --markdown "$base" ${{ steps.semanas.outputs.lista }} > comentario.md
          if [ -n "$KIT" ]; then
            {
              echo
              echo "### TikTok"
              echo "[Bajar el kit de TikTok]($KIT): un video por post del muro y el texto para pegar (LEEME.md). Se sube en TikTok Studio y se programa para el día y la hora de cada uno."
            } >> comentario.md
          fi
          if [ "$OK" != "true" ]; then
            {
              echo
              echo "### ⚠️ Hay cosas para corregir antes de aprobar"
              echo '```'
              grep -E '✗|    ' revision.txt
              echo '```'
            } >> comentario.md
          fi
          # Un solo comentario por PR: si ya hay uno, se actualiza
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq '[.[] | select(.body | startswith("<!-- vista-previa -->"))][-1].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comentario.md > /dev/null
          else
            gh pr comment "$PR" --body-file comentario.md
          fi

      - name: Marcar el PR si hay errores
        if: steps.generar.outputs.ok == 'false'
        run: |
          echo "La revisión encontró problemas: mirá el comentario del PR."
          exit 1
