name: Renovar token

# Cada lunes revisa que el token de Instagram siga andando.
# - Token de la página de Facebook (el que se usa hoy): no vence; si se
#   invalidó (contraseña nueva, permisos sacados), falla y GitHub manda un mail.
# - Token de Instagram Login (si algún día se usa): dura 60 días; se renueva
#   y se guarda en el Secret IG_TOKEN con GH_PAT_SECRETOS, un token de GitHub
#   con permiso de escribir Secrets en este repo.
on:
  schedule:
    - cron: '23 12 * * 1'   # lunes 09:23 de Uruguay
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Renovar y guardar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETOS }}
        run: node scripts/renovar-token.mjs
