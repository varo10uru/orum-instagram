name: Publicar

# Publica en Instagram lo que toca hoy, desde lo aprobado en main:
# - historias desde las 10:07 de Uruguay;
# - posts, carruseles y Reels desde las 12:37.
# Corre cada hora y publica lo que ya tiene la hora cumplida. Es así porque
# GitHub atrasa las corridas programadas (en octubre de 2026, de 4 a 5
# horas): con una por hora, siempre hay alguna cerca del horario. Lo ya
# publicado queda anotado y no se repite.
#
# A mano (Actions → Publicar → Run workflow, o `gh workflow run publicar.yml`):
# - fecha + franja: relanza un día que falló.
# - carpeta: publica ese post ya (ej. semanas/2026-10-12/1-lunes).
# - simular: hace todo menos publicar (Instagram revisa las imágenes).
# - facebook: incluye la página de Facebook en esta corrida, aunque no esté
#   prendida (sirve para probarla junto con "simular").
# La página de Facebook se prende con la variable del repo
# PUBLICAR_EN_FACEBOOK = si (README, "Página de Facebook").
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      franja:
        description: 'Qué publicar'
        type: choice
        options: [posts, historias]
        default: posts
      fecha:
        description: 'Fecha AAAA-MM-DD (vacío = hoy)'
        required: false
      carpeta:
        description: 'O un post puntual (ej. semanas/2026-10-12/1-lunes)'
        required: false
      simular:
        description: 'Simular (no publica)'
        type: boolean
        default: false
      facebook:
        description: 'Incluir la página de Facebook'
        type: boolean
        default: false

# Nunca dos corridas a la vez: así no se publica nada dos veces
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          EVENTO: ${{ github.event_name }}
          FRANJA: ${{ inputs.franja }}
          FECHA: ${{ inputs.fecha }}
          CARPETA: ${{ inputs.carpeta }}
          SIMULAR: ${{ inputs.simular }}
          FACEBOOK: ${{ inputs.facebook && 'si' || vars.PUBLICAR_EN_FACEBOOK }}
        run: |
          args=()
          if [ -n "$CARPETA" ]; then
            args+=(--carpeta "$CARPETA")
          elif [ "$EVENTO" = "schedule" ]; then
            args+=(--pendientes)
          else
            args+=(--franja "${FRANJA:-posts}")
            if [ -n "$FECHA" ]; then args+=(--fecha "$FECHA"); fi
          fi
          if [ "$SIMULAR" = "true" ]; then args+=(--simular); fi
          node scripts/publicar.mjs "${args[@]}"

      - name: Anotar en el historial
        # Aunque algo haya fallado: lo que sí se publicó tiene que quedar anotado
        if: always()
        run: |
          if git diff --quiet -- publicados.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicados.json
          git commit -m "Historial: publicado el $(TZ=America/Montevideo date +%F)"
          for intento in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
